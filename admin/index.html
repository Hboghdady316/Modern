<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio editor · Haitham Boghdady</title><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/app.js"></script><link rel="stylesheet" href="/css/select-menu.css"></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/admin/"><span class="brand-orbit" aria-hidden="true">✦</span><span>Portfolio editor<span class="brand-small">HAITHAM BOGHDADY</span></span></a>
    <nav id="owner-tools" aria-label="Editor navigation" hidden>
      <button type="button" data-section="overview" aria-current="page">Dashboard</button>
      <button type="button" data-section="projects">Projects</button>
      <button type="button" data-section="categories">Categories</button>
      <button type="button" data-section="profile">Website details</button>
      <details id="more-tools">
        <summary>More tools</summary>
        <button class="button secondary" id="save-draft" type="button" disabled>Save draft</button>
        <button type="button" data-section="experience">Experience</button>
        <button type="button" data-section="skills">Skills &amp; learning</button>
        <button type="button" data-section="backups">Backups</button>
      </details>
      <a class="button secondary" href="/" target="_blank" rel="noopener">View website ↗</a>
      <button type="button" id="logout" hidden>Sign out</button>
    </nav>
  </aside>
  <div class="main-shell">
    <header class="topbar">
      <p id="save-state" role="status">Connecting…</p>
      <div class="header-actions" id="owner-actions" hidden>
        <a class="button secondary" id="preview-draft" href="/?preview=1" target="_blank" rel="noopener" hidden>Preview ↗</a>
        <button class="button primary" id="save" type="button" disabled>Publish changes</button>
      </div>
    </header>
    <main id="panel" tabindex="-1"><p class="loading">Opening the editor…</p></main>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
</body></html>
